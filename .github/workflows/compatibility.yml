name: Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * 0"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/server/**"
      - "scripts/verify-opencode.mjs"
      - ".github/workflows/compatibility.yml"

permissions:
  contents: read

jobs:
  openai-sdk:
    name: OpenAI SDK v${{ matrix.major }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        major:
          - 5
          - 6
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install OpenAI SDK major
        run: npm install --no-save --package-lock=false "openai@^${{ matrix.major }}"

      - name: Run server contract tests
        run: |
          npm run build -w @val-bridge/protocol
          npm test -w @val-bridge/server

  opencode:
    name: OpenCode latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install current OpenCode
        run: npm install --no-save --package-lock=false opencode-ai@latest

      - name: Prepare the OpenCode binary
        run: node node_modules/opencode-ai/postinstall.mjs

      - name: Verify the Responses and tool-use contract
        env:
          OPENCODE_BIN: ${{ github.workspace }}/node_modules/.bin/opencode
        run: npm run verify:opencode
